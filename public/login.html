<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImportaChina — Entrar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:linear-gradient(135deg,#fef3c7 0%,#ffedd5 50%,#fff7ed 100%);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{background:#fff;width:400px;max-width:100%;border-radius:20px;padding:32px 26px;box-shadow:0 10px 30px rgba(0,0,0,.12);text-align:center;border-top:6px solid #b45309}
.logo{font-size:44px}
h1{color:#7c2d12;font-size:22px;margin:4px 0 2px}
p.sub{color:#b45309;font-size:13px;margin-bottom:20px}
.field{margin-bottom:12px;text-align:left}
.field label{display:block;font-size:12px;font-weight:800;color:#7c2d12;margin-bottom:4px}
input,select{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid #fdba74;font-size:15px;outline:none;background:#fffbeb}
input:focus,select:focus{border-color:#c2410c;background:#fff}
.btn{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(90deg,#c2410c,#ea580c);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px}
.btn.ghost{background:#fef3c7;color:#7c2d12;border:1.5px solid #fdba74}
#msg{margin-top:12px;font-size:13px;color:#b91c1c;min-height:18px}
.links{margin-top:16px;font-size:13px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{color:#c2410c;text-decoration:none;font-weight:700}
.demo{margin-top:16px;background:#fffbeb;border:1px dashed #fdba74;border-radius:12px;padding:10px;font-size:12px;color:#92400e;text-align:left}
</style>
<script type="importmap">{ "imports": {
"firebase/app": "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js",
"firebase/auth": "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js",
"firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js"
} }</script>
</head>
<body>
<div class="card">
<div class="logo">🛒</div>
<h1>ImportaChina</h1>
<p class="sub">Productos importados de China</p>
<form id="f">
<div class="field"><label>Correo</label><input id="email" type="email" placeholder="tucorreo@ejemplo.com" required></div>
<div class="field"><label>Contraseña</label><input id="pass" type="password" placeholder="Mínimo 8 caracteres" required></div>
<button class="btn" type="submit">Entrar</button>
<button class="btn ghost" type="button" id="btnReg">Crear cuenta</button>
</form>
<div id="msg"></div>
<div class="links"><a href="index.html">Ver catálogo</a></div>
<div class="demo"><b>Credenciales de prueba:</b><br>Admin: admin@importachina.bo / Admin12345<br>Cliente: cliente@importachina.bo / Cliente12345</div>
</div>
<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updateProfile } from "firebase/auth";
import { getFirestore, doc, setDoc, serverTimestamp } from "firebase/firestore";
import { firebaseConfig } from "./firebase-config.js";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const msg = document.getElementById("msg");
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  msg.textContent = "Verificando...";
  try {
    const cred = await signInWithEmailAndPassword(auth, document.getElementById("email").value.trim(), document.getElementById("pass").value);
    const snap = await (await import("firebase/firestore")).getDoc(doc(db, "Usuarios", cred.user.uid));
    if (!snap.exists() || snap.data().Estado !== "aprobado") {
      msg.textContent = "Tu cuenta está pendiente de aprobación del administrador.";
      await signOut(auth); return;
    }
    location.href = "index.html";
  } catch(err) { msg.textContent = "Error: " + err.code; }
};
document.getElementById("btnReg").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("pass").value;
  if (!email || pass.length < 8) { msg.textContent = "Pon correo y contraseña de mínimo 8 caracteres"; return; }
  msg.textContent = "Creando cuenta...";
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: email.split("@")[0] });
    await setDoc(doc(db, "Usuarios", cred.user.uid), {
      NombreUsuario: email.split("@")[0], CorreoUsuario: email, RolUsuario: "cliente",
      Estado: "pendiente", TelefonoUsuario: "", DireccionUsuario: "", createdAt: serverTimestamp()
    });
    await signOut(auth);
    msg.style.color = "#166534";
    msg.textContent = "Cuenta creada. Espera la aprobación del administrador para entrar.";
  } catch(err) { msg.textContent = "Error: " + err.code; }
};
</script>
</body>
</html>
